<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="작은 밭">
<meta property="og:description" content="하루 한 번, 1분. 밭 네 칸과 바깥 씨앗 하나.">
<title>작은 밭</title>
<style>
:root{--bg:#FFFFFF;--ink:#1E1E1E;--mute:#8C8C8C;--soil:#A86B3C;--leaf:#2E9E4A;--sun:#FFB703;--sun2:#FFF4D6;--gray:#F1F1EF;--gray2:#E2E2DF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.45;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px}
header{padding:26px 0 6px;display:flex;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
header .day{font-size:13px;color:var(--mute)}
.pet{display:flex;align-items:center;gap:10px;padding:10px 0 4px;font-size:15px}
.pet .face{width:28px;height:28px;border-radius:50%;background:var(--leaf);flex:none;position:relative}
.pet .face:before,.pet .face:after{content:"";position:absolute;top:11px;width:4px;height:4px;border-radius:50%;background:#fff}
.pet .face:before{left:8px}.pet .face:after{right:8px}
.pet .say b{font-weight:600;margin-right:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.field{position:relative;aspect-ratio:1/1;background:var(--soil);border-radius:22px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;transition:transform .15s}
.field:active{transform:scale(.98)}
.field .name{font-size:14px;font-weight:600;opacity:.95}
.field .time{font-size:12px;opacity:.8}
.field .time.ripe{opacity:1;font-weight:600}
.plant{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:60px;height:70px;pointer-events:none}
.plant i{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:5px;border-radius:3px;background:#DFF5E3;height:var(--h,10px);transition:height .5s}
.plant b{position:absolute;left:50%;bottom:calc(var(--h,10px) - 4px);transform:translateX(-50%);width:var(--w,10px);height:var(--w,10px);border-radius:50%;background:var(--leaf);transition:all .5s}
.field.ripe .plant b{animation:sway 1.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) rotate(8deg)}}
.stars{position:absolute;right:12px;top:12px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:80px}
.stars span{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.coins{margin-top:10px;font-size:13px;color:var(--mute)}
.seed{margin-top:22px}
.seed .big{width:100%;border-radius:999px;padding:18px 20px;background:var(--sun);font-size:17px;font-weight:700;text-align:center}
.seed .big.quiet{background:var(--gray);color:var(--mute);font-weight:500}
.seed .hint{margin:10px 2px 0;font-size:13px;color:var(--mute)}
.seed .set{background:var(--sun2);border-radius:22px;padding:16px 18px;margin-top:4px}
.seed .set b{display:block;font-size:18px;font-weight:700}
.seed .set small{display:block;font-size:13px;color:#8A6A1C;margin-top:2px}
.seed .did{width:100%;margin-top:14px;border-radius:999px;padding:16px;background:var(--ink);color:#fff;font-size:16px;font-weight:700}
.seed .did[disabled]{background:var(--gray2);color:var(--mute);font-weight:500}
.seed .undo{display:block;margin:12px auto 0;font-size:13px;color:var(--mute);text-decoration:underline}
.seed .doneline{margin-top:4px;background:var(--sun2);border-radius:22px;padding:16px 18px;font-size:15px}
footer{margin-top:auto;padding:28px 0 30px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
footer button{color:var(--mute);text-decoration:underline;font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet .box{background:#fff;width:100%;max-width:440px;border-radius:26px 26px 0 0;padding:18px 20px 30px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:18px}
.sheet .sub{font-size:13px;color:var(--mute);margin:0 0 14px}
.q{font-size:13px;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:9px 14px;font-size:14px;background:var(--gray)}
.chip.on{background:var(--ink);color:#fff}
input[type=text],input[type=time],select,textarea{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:0;border-radius:14px;background:var(--gray);color:var(--ink)}
.two{display:flex;gap:8px}
.plantbtn{width:100%;margin-top:18px;border-radius:999px;padding:16px;background:var(--sun);font-size:16px;font-weight:700}
.plantbtn[disabled]{background:var(--gray);color:var(--mute);font-weight:500}
.linkbtn{display:block;margin:14px auto 0;font-size:13px;color:var(--mute);text-decoration:underline}
textarea{height:130px;font-size:12px;line-height:1.5}
.hidden{display:none !important}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:10}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.field.ripe .plant b{animation:none}.plant i,.plant b,.field{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header><h1>작은 밭</h1><div class="day" id="day"></div></header>
  <div class="pet"><div class="face" aria-hidden="true"></div><div class="say" id="say"></div></div>
  <div class="fields" id="fields"></div>
  <div class="coins" id="coins"></div>
  <div class="seed" id="seed"></div>
  <footer><button id="btnRecord">기록 보내기</button><button id="btnPet">이름 바꾸기</button></footer>
</div>

<div class="sheet hidden" id="sheetPlant"><div class="box">
  <h2>바깥 씨앗</h2><p class="sub">밖에서 하고 오면 그 밭에만 나는 노란 열매가 생겨요. 하루 하나.</p>
  <div class="q">어느 밭</div><div class="chips" id="fc"></div>
  <div id="whatwrap" class="hidden"><div class="q">무엇을 (10분 안에 끝나는 걸로)</div><div class="chips" id="wc"></div>
  <input type="text" id="custom" class="hidden" placeholder="직접 쓰기 (예: 편의점까지 걸어가기)" maxlength="30" style="margin-top:10px">
  <div class="two"><div style="flex:1"><div class="q">언제</div><input type="time" id="when"></div><div style="flex:1.4"><div class="q">어디서 (안 써도 돼요)</div><input type="text" id="where" placeholder="예: 집 앞" maxlength="20"></div></div></div>
  <button class="plantbtn" id="plant" disabled>심기</button>
  <button class="linkbtn" id="closePlant">닫기</button>
</div></div>

<div class="sheet hidden" id="sheetRec"><div class="box">
  <h2>기록 보내기</h2><p class="sub">아래 글을 복사해서 보내 주세요. 이름이나 개인 정보는 없어요.</p>
  <div id="q7" class="hidden"><div class="q">일주일 동안 바깥 씨앗을 실제로 한 날은 며칠이었어요?</div><select id="q7v"><option value="">선택</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
  <div class="q">기록</div><textarea id="rec" readonly></textarea>
  <button class="plantbtn" id="btnCopy">복사하기</button>
  <button class="linkbtn" id="btnShare">공유로 보내기</button>
  <button class="linkbtn" id="btnClose">닫기</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const FIELDS=[
 {k:'people',n:'사람 밭',opts:['친구에게 안부 문자','가족에게 전화 5분','고맙다고 한마디','같이 밥 먹자고 묻기','오랜만인 사람에게 연락','먼저 인사하기']},
 {k:'body',n:'몸 밭',opts:['10분 걷기','물 한 잔 더','스트레칭 5분','햇빛 쬐며 5분','계단으로 올라가기','30분 일찍 눕기']},
 {k:'rest',n:'쉼 밭',opts:['음악 한 곡 끝까지','창문 열고 3분','좋아하는 간식 천천히','10분 아무것도 안 하기','사진 한 장 찍기','영상 딱 하나만']},
 {k:'work',n:'일 밭',opts:['책상 한 칸 치우기','메시지 한 통 답하기','10분만 시작하기','내일 할 일 3개 적기','밀린 것 하나 끝내기','가방 정리']}
];
const GROW_MS=6*3600*1000, SELL_AFTER_MS=12*3600*1000, MIN_AFTER_MS=10*60*1000;
const PET_LINES=['오늘도 왔네. 나는 여기서 구경할게.','흙냄새 좋다. 잘 자라고 있어.','손님이 가끔 와서 남은 걸 사 가. 걱정 마.','비 안 와도 밭은 자라. 천천히.','네 밭 모양이 조금씩 달라지는 거 알아?','나는 여기 계속 있을 거야. 올 때 오면 돼.','왼쪽 위가 제일 먼저 익을 것 같아.','오늘은 그냥 보고 가도 괜찮아.','작은 밭인데 꽤 살아 있지.','내일 또 보자. 나는 안 가.'];
const K='smallfarm_v1';
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s)return s;}catch(e){}
 const now=Date.now();return {id:Math.random().toString(36).slice(2,8),start:now,coins:0,pet:'콩이',fields:FIELDS.map(f=>({k:f.k,plantedAt:now,special:0})),seed:null,visits:[],seeds:[],dones:[],sold:[],q7:null};}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}
function today(d){d=d?new Date(d):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayNo(){return Math.floor((Date.now()-S.start)/86400000)+1;}
function fmt(ms){const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h>0?h+'시간 '+m+'분':m+'분';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
if(!S.visits.includes(today())){S.visits.push(today());save();}

function render(){
 const d=dayNo();$('day').textContent=d+'일째';
 $('say').innerHTML='<b>'+esc(S.pet)+'</b>'+esc(PET_LINES[(d-1)%PET_LINES.length]);
 const now=Date.now();const fw=$('fields');fw.innerHTML='';
 S.fields.forEach((f,i)=>{const def=FIELDS[i];let el=now-f.plantedAt;
  if(el>GROW_MS+SELL_AFTER_MS){S.coins+=2;S.sold.push(today());f.plantedAt=now;el=0;save();toast('손님이 '+def.n+' 열매를 사 갔어요');}
  const pct=Math.min(1,el/GROW_MS);const ripe=pct>=1;
  const b=document.createElement('button');b.className='field'+(ripe?' ripe':'');b.setAttribute('aria-label',def.n+(ripe?' 거두기':''));
  b.innerHTML='<div class="name">'+def.n+'</div><div class="stars">'+'<span></span>'.repeat(f.special)+'</div>'+
   '<div class="plant" style="--h:'+(8+pct*44)+'px;--w:'+(8+pct*22)+'px"><i></i><b></b></div>'+
   '<div class="time'+(ripe?' ripe':'')+'">'+(ripe?'다 자랐어요. 눌러서 거두기':fmt(GROW_MS-el)+' 뒤')+'</div>';
  b.onclick=()=>{if(!ripe){toast('아직 자라는 중이에요');return;}S.coins+=3;f.plantedAt=Date.now();save();toast('거뒀어요. 새 씨앗을 심었어요');render();};
  fw.appendChild(b);});
 $('coins').textContent='도토리 '+S.coins+(S.sold.length?' · 손님이 '+S.sold.length+'번 사 갔어요':'');
 renderSeed();
}

let pick={field:null,what:'',custom:''};
function renderSeed(){
 const box=$('seed');const s=S.seed;const t=today();
 if(s&&s.date!==t&&!s.done){s.date=t;s.carried=(s.carried||0)+1;save();}
 if(s&&s.done&&s.date===t){box.innerHTML='<button class="big quiet" disabled>오늘 바깥 씨앗은 끝</button><div class="doneline">'+esc(s.what)+' 했어요. '+FIELDS.find(f=>f.k===s.field).n+'에 노란 열매가 생겼어요.</div>';return;}
 if(s&&!s.done){const at=whenMs(s);const can=Date.now()>=at+MIN_AFTER_MS;
  box.innerHTML='<div class="set"><b>'+esc(s.what)+'</b><small>'+s.when+(s.where?' · '+esc(s.where):'')+' · '+FIELDS.find(f=>f.k===s.field).n+(s.carried?' · 어제 것을 오늘로':'')+'</small></div>'+
   '<button class="did" id="did" '+(can?'':'disabled')+'>'+(can?'했어':(Date.now()<at?s.when+'에 '+esc(S.pet)+'가 불러요':'조금만 더 하고 와요'))+'</button>'+
   '<button class="undo" id="undo">다른 걸로 바꿀래</button>';
  $('did').onclick=()=>{s.done=true;s.doneAt=Date.now();S.dones.push(t);S.fields.find(f=>f.k===s.field).special++;S.seeds.push({d:t,f:s.field,w:s.what,t:s.when,p:!!s.where,done:true,carried:s.carried||0});save();toast('노란 열매가 났어요');render();};
  $('undo').onclick=()=>{S.seed=null;save();render();};
  return;}
 box.innerHTML='<button class="big" id="openPlant">오늘 바깥 씨앗 심기</button><div class="hint">밖에서 하고 오는 씨앗 하나. 1분이면 심어요.</div>';
 $('openPlant').onclick=()=>{pick={field:null,what:'',custom:''};drawSheet();$('sheetPlant').classList.remove('hidden');};
}
function drawSheet(){
 const fdef=FIELDS.find(f=>f.k===pick.field);
 $('fc').innerHTML=FIELDS.map(f=>'<button class="chip'+(pick.field===f.k?' on':'')+'" data-k="'+f.k+'">'+f.n+'</button>').join('');
 $('fc').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pick.field=c.dataset.k;pick.what='';drawSheet();});
 $('whatwrap').classList.toggle('hidden',!fdef);
 if(fdef){$('wc').innerHTML=fdef.opts.map(o=>'<button class="chip'+(pick.what===o?' on':'')+'" data-w="'+esc(o)+'">'+esc(o)+'</button>').join('')+'<button class="chip'+(pick.what==='__c'?' on':'')+'" data-w="__c">직접 쓰기</button>';
  $('wc').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pick.what=c.dataset.w;drawSheet();if(pick.what==='__c')$('custom').focus();});}
 $('custom').classList.toggle('hidden',pick.what!=='__c');$('custom').value=pick.custom;
 if(!$('when').value)$('when').value=defaultTime();
 const ok=fdef&&(pick.what&&(pick.what!=='__c'||pick.custom.trim()));$('plant').disabled=!ok;
}
$('custom').oninput=e=>{pick.custom=e.target.value;$('plant').disabled=!pick.custom.trim();};
$('closePlant').onclick=()=>$('sheetPlant').classList.add('hidden');
$('plant').onclick=()=>{const what=pick.what==='__c'?pick.custom.trim():pick.what;if(!what||!pick.field)return;
 const when=$('when').value||defaultTime();const where=$('where').value.trim();const t=today();
 S.seed={date:t,field:pick.field,what,when,where,done:false,plantedAt:Date.now()};S.seeds.push({d:t,f:pick.field,w:what,t:when,p:!!where,done:false});save();
 if('Notification'in window&&Notification.permission==='default'){Notification.requestPermission();}
 $('sheetPlant').classList.add('hidden');$('where').value='';$('when').value='';toast(when+'에 '+S.pet+'가 한 번 불러요');render();};
function defaultTime(){const d=new Date(Date.now()+3600000);return String(d.getHours()).padStart(2,'0')+':'+String(Math.floor(d.getMinutes()/10)*10).padStart(2,'0');}
function whenMs(s){const p=s.when.split(':').map(Number);const d=new Date();d.setHours(p[0],p[1],0,0);return d.getTime();}
let pinged=null;
setInterval(()=>{const s=S.seed;if(s&&!s.done&&s.date===today()){const at=whenMs(s);if(Date.now()>=at&&pinged!==s.date+s.when){pinged=s.date+s.when;toast(S.pet+': 지금이래. '+s.what);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('작은 밭',{body:S.pet+': 지금이래. '+s.what});}catch(e){}}}}render();},60000);

function record(){const d=dayNo();const L=['작은밭 기록 '+S.id,'시작 '+today(S.start)+' · 오늘 '+d+'일째','접속한 날 '+S.visits.length+'일: '+S.visits.map(v=>v.slice(5)).join(','),'바깥 씨앗 심음 '+S.seeds.length+'회 / 했어 '+S.dones.length+'일: '+S.dones.map(v=>v.slice(5)).join(','),'씨앗 목록: '+(S.seeds.map(x=>x.d.slice(5)+' '+FIELDS.find(f=>f.k===x.f).n.replace(' 밭','')+'/'+x.w+'/'+x.t+(x.p?'/장소':'')+(x.done?'/함':'')).join(' | ')||'없음'),'도토리 '+S.coins+' · 손님 판매 '+S.sold.length+'회'];
 if(S.q7!==null&&S.q7!=='')L.push('실제로 한 날(본인 답) '+S.q7+'일');return L.join('\n');}
$('btnRecord').onclick=()=>{$('sheetRec').classList.remove('hidden');if(dayNo()>=7){$('q7').classList.remove('hidden');$('q7v').value=S.q7||'';}$('rec').value=record();};
$('q7v').onchange=e=>{S.q7=e.target.value;save();$('rec').value=record();};
$('btnClose').onclick=()=>$('sheetRec').classList.add('hidden');
$('btnCopy').onclick=()=>{const ta=$('rec');ta.select();try{if(navigator.clipboard){navigator.clipboard.writeText(ta.value);}else{document.execCommand('copy');}toast('복사했어요. 카톡에 붙여 넣어 주세요');}catch(e){document.execCommand('copy');toast('복사했어요');}};
$('btnShare').onclick=()=>{if(navigator.share){navigator.share({text:record()}).catch(()=>{});}else{toast('이 폰은 공유가 안 돼요. 복사해 주세요');}};
$('btnPet').onclick=()=>{const n=prompt('이름',S.pet);if(n&&n.trim()){S.pet=n.trim().slice(0,8);save();render();}};
render();
})();
</script>
</body>
</html>
